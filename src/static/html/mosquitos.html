<!doctype html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <div class="wall"></div>
  <div class="mosquito">

    <div class="leg"><div><div><div></div></div></div></div>
    <div class="leg"><div><div><div></div></div></div></div>
    <div class="leg"><div><div><div></div></div></div></div>
    <div class="leg"><div><div><div></div></div></div></div>
    <div class="leg"><div><div><div></div></div></div></div>
    <div class="leg"><div><div><div></div></div></div></div>

    <div class="head"></div>

    <div class="abdomen"></div>

    <div class="wing"></div>
    <div class="wing"></div>
  </div>
<style>
@property --t {
  syntax: "<number>";
  initial-value: 0;
  inherits: true;
}

@keyframes tick {
  from { --t: 0; }
  to { --t: 2147483647; }
}

:root {
  --deg: 0;
  --t: 0;
}
html {
  animation: tick 1000000s linear infinite;
  box-sizing: border-box;
  font-size: 4px;
}
*, *:before, *:after {
  box-sizing: inherit;
}
html,body{
  width: 100%;
  height: 100%;
  margin:0;
  padding:0;
}
body{
  position: relative;
  background:radial-gradient(ellipse at top, #D8D1BC, #F0ECE7);
  &:before{
    content:'';
    position: absolute;
    display:block;
    background:var(--noise);
    background-size:6400%; 
    inset:0;
    mix-blend-mode: multiply;
    opacity: 0.4;
  }
  &:after{
    content:'';
    position: absolute;
    display:block;
    background:var(--noise);
    inset:0;
    mix-blend-mode: multiply;
    opacity: 0.1;
  }
}

.wall{
  position: absolute;
  left: 0;
  top: 0;
  width:100%;
  height:100%;
  overflow:hidden;
}

.mosquito{
  position: absolute;
  left: 40vw;
  top: 40vw;
  z-index: 10;
  width: 1rem;
  height: 1rem;
  background: #000;
  border-radius: 1rem 1rem 1rem 1rem;
  &:before{
    content:'';
    position: absolute;
    display:block;
    background:#f040;
    width: 8rem;
    height: 8rem;
    transform: translate(-50%,-50%);
  }
  &.shade{
    z-index: 1;
    transform: skew(10deg,20deg) scaleY(2);
    transform-origin: -1rem -3rem;
    opacity:0.05;
    &,*{
      background: #000;
      box-shadow: none;
      clip-path: none;
    }
  }
}
.leg{
  left:50%;
  top:50%;
  width: 0.125rem;
  height: 4rem;
  --deg:30deg;
  &,*{
    position:absolute;
    background:#000;
    transform-origin: 50% 0;
    transform:translate(-50%) rotate(var(--deg));
  }
  *{
    left:50%;
    top:100%;
    width:75%;
    height:75%;
  }
}
.head{
  position: absolute;
  left: 50%;
  top: 50%;
  background: #000;
  width: 90%;
  height: 90%;
  border-radius: 1rem 1rem 1rem 1rem;
  transform: rotate(var(--deg));
  transform-origin: 0 0;
  &:after{
    content:'';
    display:block;
    position: absolute;
    left: 50%;
    top: 50%;
    background: #000;
    width: 50%;
    height: 200%;
    transform:tranlate(-50%,0) rotate(44deg);
    transform-origin: 50% 0;
    clip-path: polygon(100% 0, 0 0, 50% 100%);
  }
}
.abdomen{
  position: absolute;
  left: 50%;
  top: 50%;
  background:
    radial-gradient(ellipse at top left, #000,transparent 50%),
    repeating-radial-gradient(ellipse at top left, transparent 0.2rem,#800 0.4rem),
    #000
  ;
  -background-position: -100% -100%;
  background-repeat: repeat;
  width: 140%;
  height: 140%;
  border-radius: 0 1rem 1rem 1rem;
  transform: rotate(var(--deg)) skew(60deg,60deg);
  transform-origin: 0 0;
}
.wing{
  position: absolute;
  left: 50%;
  top: 50%;
  background: #5313;
  width: 200%;
  height: 200%;
  border-radius: 0 1rem 1rem 1rem;
  transform: rotate(var(--deg)) skew(60deg,60deg);
  transform-origin: 0 0;
  box-shadow: 0.06125rem 0.06125rem 0  0.125rem #5316 inset;
}
</style>
<script>
const multiplier = 1664525
const increment = 1013904223
const modulus = 4294967296
//let seed = 217197374//(Math.random()*multiplier)<<0
let seed = (Math.random()*multiplier)<<0
function random(_seed){
  return seed = ( (_seed||seed) * multiplier + increment ) % modulus
}
function rand(_seed){
  return random(_seed)/modulus
}
  
const {body} = document
const {style} = body

let {clientHeight:h,clientWidth:w} = body

const wall = document.querySelector('.wall')
const mosquito = document.querySelector('.mosquito')
mosquito.remove()

Array.from(new Array(20)).forEach(()=>{
  const m = mosquito.cloneNode(true)
  wall.appendChild(m)
  const s = mosquito.cloneNode(true)
  s.classList.add('shade')
  wall.appendChild(s)
  m.shade = s
})

style.setProperty('--noise', `url(${makeNoiseDataURL()})`)

body.addEventListener('click',e=>{
  const {target,currentTarget} = e
  target.matches('body')
    ?reset()
    :reset(target.closest('.mosquito'))
},false)

new ResizeObserver(()=>reset()).observe(body)

reset()

function reset(target){
  w = body.clientWidth
  h = body.clientHeight
  target||Array.from(document.querySelectorAll('.mosquito:not(.shade)')).forEach(m=>{
    const left = w*rand() + 'px'
    const top = h*rand() + 'px'
    Object.assign(m.style,{left,top})
    Object.assign(m.shade.style,{left,top})
  })
  ;(target
    ?[...target.querySelectorAll('*'),...target.shade.querySelectorAll('*')]
    :Array.from(document.querySelectorAll('.mosquito *')))
    .forEach(m=>{
      setCSSProp(m,'deg',rand()*360 +'deg')
    })
}


function setCSSProp(elm, name, value){
  elm.style.setProperty(`--${name}`, value)
}

function makeNoiseDataURL(size = 128, fn, seed) {
  const canvas = document.createElement('canvas')
  canvas.width = size
  canvas.height = size
  const ctx = canvas.getContext('2d')
  const imgData = ctx.createImageData(size, size)
  const data = imgData.data

  for (let i = 0; i < data.length; i += 4) {
    data[i] =
      data[i + 1] =
      data[i + 2] = (fn?fn(rand()):rand()) * 255
    data[i + 3] = 255
  }

  ctx.putImageData(imgData, 0, 0)
  return canvas.toDataURL('image/png')
}
</script>
</body>
